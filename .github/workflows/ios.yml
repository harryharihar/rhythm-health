name: iOS Build & Distribute

on:
  push:
    branches: [develop, main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # develop -> Dev/UAT variant (fastlane lane `dev`), main -> Prod
      # variant (fastlane lane `prod`). Bundle id/app name/icon are already
      # driven by APP_ENV via app.config.js.
      - name: Resolve environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "app_env=production" >> "$GITHUB_OUTPUT"
            echo "fastlane_lane=prod" >> "$GITHUB_OUTPUT"
            echo "firebase_app_id=${{ secrets.FIREBASE_IOS_APP_ID_PROD }}" >> "$GITHUB_OUTPUT"
            echo "tester_group=prod-testers" >> "$GITHUB_OUTPUT"
          else
            echo "app_env=dev" >> "$GITHUB_OUTPUT"
            echo "fastlane_lane=dev" >> "$GITHUB_OUTPUT"
            echo "firebase_app_id=${{ secrets.FIREBASE_IOS_APP_ID_DEV }}" >> "$GITHUB_OUTPUT"
            echo "tester_group=dev-testers" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate native iOS project
        run: APP_ENV=${{ steps.env.outputs.app_env }} npx expo prebuild --platform ios --clean

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Build and sign via fastlane
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bundle exec fastlane ${{ steps.env.outputs.fastlane_lane }}

      # wzieba/Firebase-Distribution-Github-Action is a Docker container
      # action, which GitHub only supports on Linux runners — this job runs
      # on macOS (required for xcodebuild), so it has to use the Firebase
      # CLI directly instead (works cross-platform, already have Node set up).
      - name: Upload to Firebase App Distribution
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_APP_ID: ${{ steps.env.outputs.firebase_app_id }}
          TESTER_GROUP: ${{ steps.env.outputs.tester_group }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          npx firebase-tools appdistribution:distribute ios/PocketVitals.ipa \
            --app "$FIREBASE_APP_ID" \
            --groups "$TESTER_GROUP"
