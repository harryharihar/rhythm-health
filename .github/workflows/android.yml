name: Android Build & Distribute

on:
  push:
    branches: [develop, main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      # develop -> Dev/UAT variant, main -> Prod variant. Everything else
      # (bundle id, app name, icon) is already driven by APP_ENV via
      # app.config.js, so this is the only place the branch matters.
      - name: Resolve environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "app_env=production" >> "$GITHUB_OUTPUT"
            echo "firebase_app_id=${{ secrets.FIREBASE_ANDROID_APP_ID_PROD }}" >> "$GITHUB_OUTPUT"
            echo "tester_group=prod-testers" >> "$GITHUB_OUTPUT"
          else
            echo "app_env=dev" >> "$GITHUB_OUTPUT"
            echo "firebase_app_id=${{ secrets.FIREBASE_ANDROID_APP_ID_DEV }}" >> "$GITHUB_OUTPUT"
            echo "tester_group=dev-testers" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate native Android project
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: APP_ENV=${{ steps.env.outputs.app_env }} npx expo prebuild --platform android --clean

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ steps.env.outputs.firebase_app_id }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: ${{ steps.env.outputs.tester_group }}
          file: android/app/build/outputs/apk/release/app-release.apk
